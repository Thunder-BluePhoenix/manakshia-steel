
<!DOCTYPE html>
<html>
<head>
    <title>Login | Manaksia Steels Limited</title>

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Lato", sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
        }

        .left-side {
            width: 60%;
            background-image: url('/assets/manakshia_steel/images/background2.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 0 20px 20px 0;

        }

        .right-side {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-box p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .checkbox-row input {
            margin-right: 8px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .footer span {
            font-weight: bold;
            color: #000;
        }

        @media (max-width: 768px) {
            .left-side {
                display: none;
            }
            .right-side {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="left-side"></div>

    <div class="right-side">
        <img class="logo" src="/assets/manakshia_steel/images/manaksia_logo.png" alt="Manaksia Steels Limited" />
        
        <div class="login-box">
            <h2>Login</h2>
            <p>welcome to your workspace</p>
            <form method="POST" action="/api/method/login">
                <input type="text" name="usr" placeholder="user id" required />
                <input type="password" name="pwd" placeholder="password" required />
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="footer">
            <img src="/assets/manakshia_steel/images/indware-digital.png" width="150" style="margin-top: 20px;"><br>
            Powered By Indware Digital
        </div>
    </div>

        <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();
            const form = e.target;

            fetch("/api/method/login", {
                method: "POST",
                body: new FormData(form),
                credentials: "same-origin"
            })
                .then(res => res.json())
                .then(data => {
                    if (data.message === "Logged In") {
                        window.location.href = "/app";  // ✅ go to app after login
                    } else {
                        alert("Invalid username or password");
                    }
                })
                .catch(err => {
                    alert("Login failed. Try again.");
                });
        });
    </script>

</body>
</html>
